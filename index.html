<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praise List</title>
<meta name="theme-color" content="#f7fbf1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    color-scheme: light;
    --bg: #f7fbf1; --surface: #ebefe6; --field: #ffffff; --ink: #191d17; --muted: #43483f;
    --outline: #73796e; --primary: #3b6939; --on-primary: #ffffff; --tonal: #bcf0b4; --on-tonal: #002204;
    --prev: #dfe4d8; --err: #ffdad6; --on-err: #93000a; --sharp: #2e3b2d; --on-sharp: #e6f5e3; --scrim: rgba(25, 28, 32, .4);
    --struk-w: 384px; /* 58mm. Untuk 80mm ganti jadi 576px */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10140f; --surface: #1c211b; --field: #10140f; --ink: #e0e4db; --muted: #c3c8bb;
      --outline: #8d9387; --primary: #a1d39a; --on-primary: #0a390f; --tonal: #235025; --on-tonal: #bcf0b4;
      --prev: #272c25; --err: #93000a; --on-err: #ffdad6; --sharp: #122a14; --on-sharp: #bcf0b4; --scrim: rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10140f; --surface: #1c211b; --field: #10140f; --ink: #e0e4db; --muted: #c3c8bb;
    --outline: #8d9387; --primary: #a1d39a; --on-primary: #0a390f; --tonal: #235025; --on-tonal: #bcf0b4;
    --prev: #272c25; --err: #93000a; --on-err: #ffdad6; --sharp: #122a14; --on-sharp: #bcf0b4; --scrim: rgba(0, 0, 0, .6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; max-width: 480px; min-height: 100vh; margin-inline: auto;
    background: var(--bg); color: var(--ink);
    font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px;
    padding-bottom: calc(160px + env(safe-area-inset-bottom));
  }

  .appbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px 20px;
  }
  .appbar h1 { margin: 0; font-size: 22px; font-weight: 500; }

  .page { display: none; padding: 4px 16px 0; }
  .page.on { display: block; }

  .card { background: var(--surface); border-radius: 24px; padding: 16px; margin-bottom: 12px; }
  .sec { font-size: 14px; font-weight: 500; color: var(--muted); margin: 4px 4px 8px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px 16px; }
  input {
    width: 100%; padding: 14px 16px; border: 1px solid var(--outline); border-radius: 16px;
    font: inherit; color: inherit; background: var(--field);
  }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .head .full { grid-column: 1 / -1; }

  table, tbody { display: block; width: 100%; }
  #rows tr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 5px 0; }
  #rows td.subs, #rows td.addm { flex: 0 0 100%; }
  #rows td.subs:empty { display: none; }
  #rows td.addm { padding-left: 40px; }
  .sub { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 40px; }
  .sub .sj { flex: 1; min-width: 0; }
  .medley { height: 36px; padding: 0 16px; border-radius: 12px; background: var(--field); color: var(--muted); font-weight: 400; font-size: 14px; }
  #rows td { padding: 0; }
  td.no { flex: 0 0 32px; }
  td.no span {
    display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--tonal); color: var(--on-tonal);
    font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
  }
  #rows td:nth-child(2) { flex: 1; min-width: 0; }
  td.k { flex: 0 0 auto; }
  td.x { flex: 0 0 32px; }

  button {
    height: 48px; padding: 0 24px; border: 0; background: var(--primary); color: var(--on-primary);
    border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer;
  }
  button.alt { background: transparent; color: var(--primary); }
  button:disabled { opacity: .5; cursor: wait; }
  .kbtn {
    width: auto; min-width: 68px; height: auto; padding: 14px 8px; border-radius: 16px; white-space: nowrap;
    background: var(--tonal); color: var(--on-tonal); text-align: center;
  }
  .kbtn.empty { background: transparent; color: var(--muted); font-weight: 400; box-shadow: inset 0 0 0 1px var(--outline); }
  .del, .sdel { width: 32px; height: 32px; padding: 0; background: transparent; color: var(--muted); font-size: 16px; }
  svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn { width: 40px; height: 40px; padding: 0; border-radius: 50%; background: var(--tonal); color: var(--on-tonal); display: grid; place-items: center; }
  .save { width: 100%; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .del svg, .sdel svg { width: 20px; height: 20px; }

  .fab {
    position: fixed; right: max(16px, calc(50% - 224px)); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 6;
    height: 56px; padding: 0 24px 0 16px; border-radius: 16px; font-size: 16px; display: flex; align-items: center; gap: 8px;
    background: var(--tonal); color: var(--on-tonal); box-shadow: 0 3px 8px rgba(0,0,0,.2);
  }
  body.view .fab { display: none; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
    max-width: 480px; margin: 0 auto; display: flex; background: var(--surface);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px;
  }
  .bottom button {
    flex: 1; height: 56px; border-radius: 16px; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 12px; padding: 0;
  }
  
  .bottom button.on { background: var(--tonal); color: var(--on-tonal); }

  #picker { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  #picker.open { display: flex; }
  #picker .box { background: var(--bg); border-radius: 28px 28px 0 0; padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); width: 100%; max-width: 480px; text-align: center; }
  #picker .ttl { margin-bottom: 16px; font-size: 20px; }
  #picker .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #picker .grid.two { grid-template-columns: 1fr 1fr; }
  #picker .grid.three { grid-template-columns: repeat(3, 1fr); }
  #picker .grid button { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #picker .grid button.tm { font-size: 13px; }
  #picker .grid button.blk { background: var(--sharp); color: var(--on-sharp); }
  #picker .grid button.danger { background: var(--err); color: var(--on-err); }
  #picker .grid button { height: auto; padding: 18px 0; font-size: 18px; background: var(--tonal); color: var(--on-tonal); border-radius: 20px; }
  #picker .bottom2 { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }

  .preview { background: var(--prev); padding: 12px; border-radius: 24px; overflow-x: auto; }

  /* Struk */
  #struk {
    width: var(--struk-w); margin: 0 auto; background: #fff; color: #000;
    padding: 16px 14px 22px; font-family: "Courier New", Courier, monospace; font-size: 14px; line-height: 1.35;
  }
  #struk .title { text-align: center; font-weight: 700; font-size: 17px; letter-spacing: 1px; margin-bottom: 8px; }
  #struk .sep { border-top: 2px dashed #000; margin: 8px 0; }
  #struk .meta { display: flex; gap: 6px; }
  #struk .meta b { flex: 0 0 124px; font-weight: 700; }
  #struk .meta span { flex: 1; word-break: break-word; }
  #struk .li { display: flex; gap: 6px; padding: 2px 0; }
  #struk .li .n { flex: 0 0 24px; }
  #struk .li .j { flex: 1; word-break: break-word; }
  #struk .li .k { flex: 0 0 100px; font-weight: 700; text-align: center; }
  #struk .li.h { font-weight: 700; }
  #struk .li.s { padding-top: 0; }
  #struk .li.m .n, #struk .li.m .j, #struk .li.s .j { font-weight: 700; }
  #struk .li.s i { font-weight: 400; }
  #struk .foot { text-align: center; margin-top: 4px; }

  /* Halaman struk disembunyikan di luar layar (bukan display:none) supaya html2canvas tetap bisa menangkapnya */
  .page:not(.on) { display: block; position: absolute; left: -10000px; top: 0; width: 480px; }
</style>
</head>
<body>
<header class="appbar">
  <h1>Praise List</h1>
  <button id="btnTema" class="iconbtn" aria-label="Tema"></button>
</header>

<main>
  <section class="page on" id="pgEdit">
    <div class="card">
      <div class="head">
        <div class="full">
          <label for="nama">Worship Leader</label>
          <input id="nama" type="text" autocomplete="off">
        </div>
        <div>
          <label for="ibadah">Ibadah</label>
          <input id="ibadah" type="text" autocomplete="off">
        </div>
        <div>
          <label for="tanggal">Tanggal</label>
          <input id="tanggal" type="date">
        </div>
      </div>
    </div>

    <div class="sec">Lagu</div>
    <div class="card">
      <table><tbody id="rows"></tbody></table>
    </div>
  </section>

  <section class="page" id="pgView">
    <div class="preview">
      <div id="struk"></div>
    </div>
    <button id="btnSimpan" class="save"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Simpan</button>
  </section>
</main>

<button class="fab" id="btnAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Lagu</button>

<nav class="bottom">
  <button id="navEdit" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Daftar</button>
  <button id="navView"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg>Print Preview</button>
</nav>

<div id="picker">
  <div class="box">
    <div class="ttl" id="pkTtl"></div>
    <div class="grid" id="pkGrid"></div>
    <div class="bottom2">
      <button type="button" class="alt" id="pkClear">Selesai</button>
      <button type="button" class="alt" id="pkCancel">Batal</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const rows = $('rows');
  const ICON = {"list": "<svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h10\"/></svg>", "print": "<svg viewBox=\"0 0 24 24\"><path d=\"M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2\"/><rect x=\"6\" y=\"14\" width=\"12\" height=\"7\" rx=\"1\"/></svg>", "light": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg>", "dark": "<svg viewBox=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/></svg>", "system": "<svg viewBox=\"0 0 24 24\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"/><path d=\"M11 18h2\"/></svg>", "save": "<svg viewBox=\"0 0 24 24\"><path d=\"M12 3v12m0 0-4-4m4 4 4-4M5 21h14\"/></svg>", "plus": "<svg viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/></svg>", "x": "<svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg>"};

  function addRow() {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="no"><span></span></td>' +
      '<td><input class="judul" type="text" placeholder="Judul lagu" autocomplete="off"></td>' +
      '<td class="k"><button type="button" class="kbtn empty">Kunci</button></td>' +
      '<td class="x"><button type="button" class="del" aria-label="Hapus">'+ICON.x+'</button></td>' +
      '<td class="subs"></td>' +
      '<td class="addm"><button type="button" class="medley">＋ Medley</button></td>';
    rows.appendChild(tr);
    return tr;
  }

  function addSub(tr) {
    const sb = document.createElement('div');
    sb.className = 'sub';
    sb.innerHTML =
      '<input class="sj" type="text" placeholder="Judul lagu medley" autocomplete="off">' +
      '<button type="button" class="kbtn empty">Kunci</button>' +
      '<button type="button" class="sdel" aria-label="Hapus">' + ICON.x + '</button>';
    tr.querySelector('.subs').appendChild(sb);
    return sb;
  }

  const val = (tr, c) => c === 'kunci' ? (tr.dataset.kunci || '') : tr.querySelector('.' + c).value.trim();
  const isEmpty = tr => !val(tr, 'judul') && !val(tr, 'kunci') && !tr.querySelector('.sub');

  function renumber() {
    [...rows.children].forEach((tr, i) => { tr.querySelector('.no span').textContent = i + 1; });
  }

  function sync() {
    renumber();
    render();
  }

  rows.addEventListener('input', sync);


  rows.addEventListener('click', e => {
    const m = e.target.closest('.medley');
    if (m) {
      const sb = addSub(m.closest('tr'));
      sync();
      sb.querySelector('.sj').focus();
      return;
    }
    const x = e.target.closest('.sdel');
    if (x) {
      x.closest('.sub').remove();
      sync();
      return;
    }
    const d = e.target.closest('.del');
    if (!d) return;
    const tr = d.closest('tr');
    if (rows.children.length > 1) {
      tr.remove();
    } else {
      tr.querySelector('.judul').value = '';
      setKunci(tr, '');
    }
    sync();
  });

  $('btnAdd').onclick = () => {
    const tr = addRow();
    sync();
    tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
    tr.querySelector('.judul').focus({ preventScroll: true });
  };

  function tab(n) {
    document.body.classList.toggle('view', n === 'view');
    $('pgEdit').classList.toggle('on', n === 'edit');
    $('pgView').classList.toggle('on', n === 'view');
    $('navEdit').classList.toggle('on', n === 'edit');
    $('navView').classList.toggle('on', n === 'view');
    window.scrollTo(0, 0);
  }
  $('navEdit').onclick = () => tab('edit');
  $('navView').onclick = () => tab('view');

  const picker = $('picker');
  let pickTr = null;
  let pickNote = '';
  let pickKeys = [];

  function stepMode() {
    $('pkTtl').textContent = (pickKeys.length ? 'Modulasi ke ' : 'Kunci ') + pickNote + '…';
    $('pkClear').style.display = 'none';
    $('pkGrid').className = 'grid two';
    $('pkGrid').innerHTML =
      '<button type="button" data-mode="maj">Major</button>' +
      '<button type="button" data-mode="min">Minor</button>';
  }

  function stepMore() {
    $('pkTtl').textContent = pickKeys.join('→');
    $('pkClear').style.display = '';
    $('pkClear').textContent = 'Selesai';
    $('pkGrid').className = 'grid three';
    $('pkGrid').innerHTML =
      '<button type="button" class="tm" data-act="more">＋ Modulasi</button>' +
      '<button type="button" class="tm" data-act="reset">Ganti</button>' +
      '<button type="button" class="tm danger" data-act="clear">Kosongkan</button>';
  }

  function stepNote() {
    $('pkTtl').textContent = pickKeys.length ? 'Modulasi ke…' : 'Pilih nada dasar';
    $('pkClear').style.display = 'none';
    $('pkGrid').className = 'grid';
    $('pkGrid').innerHTML = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'].map(n =>
      '<button type="button"' + (n.length > 1 ? ' class="blk"' : '') + ' data-note="' + n + '">' + n + '</button>'
    ).join('');
  }

  function closePicker() {
    picker.classList.remove('open');
    pickTr = null;
  }

  function setKunci(tr, v) {
    tr.dataset.kunci = v;
    const b = tr.querySelector('.kbtn');
    b.textContent = v || 'Kunci';
    b.classList.toggle('empty', !v);
    sync();
  }

  rows.addEventListener('click', e => {
    const b = e.target.closest('.kbtn');
    if (!b) return;
    pickTr = b.closest('.sub') || b.closest('tr');
    pickKeys = (pickTr.dataset.kunci || '').split('→').filter(Boolean);
    if (pickKeys.length) stepMore(); else stepNote();
    picker.classList.add('open');
  });

  $('pkGrid').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.theme) {
      applyTheme(b.dataset.theme);
      closePicker();
      return;
    }
    if (b.dataset.act) {
      if (b.dataset.act === 'clear') { if (pickTr) setKunci(pickTr, ''); closePicker(); return; }
      if (b.dataset.act === 'reset') pickKeys = [];
      stepNote();
      return;
    }
    if (b.dataset.note) {
      pickNote = b.dataset.note;
      stepMode();
    } else if (b.dataset.mode && pickTr) {
      pickKeys.push(pickNote + (b.dataset.mode === 'min' ? 'm' : ''));
      setKunci(pickTr, pickKeys.join('→'));
      stepMore();
    }
  });

  function applyTheme(t) {
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('btnTema').innerHTML = ICON[t];
    try { localStorage.setItem('wl-theme', t); } catch (e) {}
  }

  $('btnTema').onclick = () => {
    $('pkTtl').textContent = 'Tema';
    $('pkClear').style.display = 'none';
    $('pkGrid').className = 'grid three';
    $('pkGrid').innerHTML =
      '<button type="button" class="tm" data-theme="light">' + ICON.light + 'Terang</button>' +
      '<button type="button" class="tm" data-theme="dark">' + ICON.dark + 'Gelap</button>' +
      '<button type="button" class="tm" data-theme="system">' + ICON.system + 'Ikut perangkat</button>';
    picker.classList.add('open');
  };

  $('pkClear').onclick = closePicker;
  $('pkCancel').onclick = closePicker;
  picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });

  rows.addEventListener('keydown', e => {
    if (!e.target.classList.contains('judul') || e.isComposing) return;
    const tr = e.target.closest('tr');
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!val(tr, 'judul')) return;
      const next = tr.nextElementSibling || addRow();
      sync();
      next.querySelector('.judul').focus();
    } else if (e.key === 'Backspace' && !e.repeat && !e.target.value &&
               isEmpty(tr) && rows.children.length > 1) {
      e.preventDefault();
      const prev = tr.previousElementSibling || tr.nextElementSibling;
      tr.remove();
      sync();
      const inp = prev.querySelector('.judul');
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  });

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function fmtTanggal(v) {
    if (!v) return '';
    return new Date(v + 'T00:00:00').toLocaleDateString('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  function render() {
    const list = [...rows.children]
      .map((tr, i) => ({
        n: i + 1, j: val(tr, 'judul'), k: val(tr, 'kunci'),
        subs: [...tr.querySelectorAll('.sub')]
          .map(sb => ({ j: sb.querySelector('.sj').value.trim(), k: sb.dataset.kunci || '' }))
          .filter(x => x.j || x.k)
      }))
      .filter(r => r.j || r.k || r.subs.length);
    const fk = k => esc(k.split('→').join(' -> '));

    $('struk').innerHTML =
      '<div class="title">DAFTAR PUJIAN</div>' +
      '<div class="sep"></div>' +
      '<div class="meta"><b>Worship Leader</b><span>: ' + esc($('nama').value.trim()) + '</span></div>' +
      '<div class="meta"><b>Ibadah</b><span>: ' + esc($('ibadah').value.trim()) + '</span></div>' +
      '<div class="meta"><b>Tanggal</b><span>: ' + esc(fmtTanggal($('tanggal').value)) + '</span></div>' +
      '<div class="sep"></div>' +
      '<div class="li h"><span class="n">No</span><span class="j">Judul (' + list.length + ' lagu)</span><span class="k">Kunci</span></div>' +
      '<div class="sep"></div>' +
      list.map(r =>
        '<div class="li m"><span class="n">' + r.n + '.</span><span class="j">' + esc(r.j) +
        '</span><span class="k">' + fk(r.k) + '</span></div>' +
        r.subs.map(x =>
          '<div class="li s"><span class="n"></span><span class="j"><i>(medl.)</i> ' + esc(x.j) +
          '</span><span class="k">' + fk(x.k) + '</span></div>'
        ).join('')
      ).join('') +
      '<div class="sep"></div>' +
      '<div class="foot">Tuhan Yesus Memberkati 😇🙏</div>';
  }

  ['nama', 'ibadah', 'tanggal'].forEach(id => $(id).addEventListener('input', render));

  function fileBase() {
    const t = $('tanggal').value || 'wl';
    const n = $('nama').value.trim().replace(/[^\w\-]+/g, '_');
    return 'WL_' + (n ? n + '_' : '') + t;
  }

  async function snap() {
    return html2canvas($('struk'), { scale: 3, backgroundColor: '#ffffff' });
  }

  function save(url, name) {
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
  }

  async function run(btn, fn) {
    btn.disabled = true;
    try { await fn(); } finally { btn.disabled = false; }
  }

  $('btnSimpan').onclick = e => run(e.target, async () => {
    const c = await snap();
    save(c.toDataURL('image/jpeg', 0.95), fileBase() + '.jpg');
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

  let savedTheme = 'system';
  try { savedTheme = localStorage.getItem('wl-theme') || 'system'; } catch (e) {}
  applyTheme(savedTheme);

  $('tanggal').value = new Date().toISOString().slice(0, 10);
  addRow();
  renumber();
  render();
</script>
</body>
</html>
